name: CI/CD & Deployment Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # go.mod requires go 1.26.5; allow Go to select the exact toolchain from go.mod.
  GOTOOLCHAIN: auto
  # IMAGE_NAME is computed per-job (lowercased): GHCR rejects uppercase
  # repository names, and github.repository keeps the original casing
  # (e.g. aniket2348823/Pre-Code) which breaks the ghcr.io tag.

jobs:
  # ── 1. TEST & LINT ──
  test:
    name: Run Tests & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true

      - name: Run Unit & Integration Tests
        run: go test -v -race -short -count=1 ./...

      - name: Verify Build
        run: |
          go build -o bin/api ./cmd/api
          go build -o bin/proxy ./cmd/proxy

  # ── 2. DOCKER BUILD & PUSH ──
  docker:
    name: Build & Push Container Image
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # ── 3. DEPLOY TO STAGING ──
  deploy-staging:
    name: Deploy to Staging Namespace
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Staging (K8s)
        run: |
          echo "Deploying ${{ github.sha }} to staging namespace vigilagent-staging..."
          # Uses kubectl apply when KUBECONFIG secret is set
          # kubectl apply -f k8s/configmap.yaml -n vigilagent-staging
          # kubectl apply -f k8s/deployment.yaml -n vigilagent-staging

  # ── 4. AUTOMATED K6 LOAD TESTING ──
  load-test-staging:
    name: Automated k6 Performance Verification
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve staging target URL
        id: target
        run: |
          # Load tests only run against a real staging URL. When no secret is
          # configured, skip cleanly instead of failing against localhost.
          echo "url=${LOADTEST_TARGET_URL:-http://localhost:8080}" >> "$GITHUB_OUTPUT"
          echo "configured=$([ -n "$LOADTEST_TARGET_URL" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        env:
          LOADTEST_TARGET_URL: ${{ secrets.LOADTEST_TARGET_URL }}

      - name: Run k6 Load Test
        if: steps.target.outputs.configured == 'true'
        uses: grafana/k6-action@v0.3.1
        env:
          BASE_URL: ${{ steps.target.outputs.url }}
          API_TOKEN: 'test-secret-key'
        with:
          filename: scripts/loadtest.js

  # ── 5. BLUE-GREEN PRODUCTION ROLLOUT ──
  deploy-production:
    name: Deploy to Production (Blue-Green)
    needs: load-test-staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Blue-Green Switch
        run: |
          chmod +x scripts/blue-green-deploy.sh
          echo "Blue-green deployment ready for release tag ${{ github.sha }}"
