name: SAST/DAST Security Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6 AM UTC

permissions:
  contents: read
  security-events: write

env:
  # go.mod requires go 1.26.5; allow Go to select the exact toolchain from go.mod.
  GO_VERSION: '1.26.5'
  GOTOOLCHAIN: auto

jobs:
  # ── 1. STATIC APPLICATION SECURITY TESTING (SAST) ──
  sast:
    name: Static Analysis (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Run staticcheck
        # Direct binary invocation: the staticcheck-action wrapper does not
        # accept an 'args' input, so -tests=false (production-only gate) cannot
        # be passed through it. Test files are analyzed separately and pedantic
        # test-only warnings (e.g. SA1012 nil contexts in tests) must not block
        # merges.
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck -tests=false ./...

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Run semgrep (Go security rules)
        # Direct invocation (the deprecated action can't scope paths/severity).
        # .semgrepignore excludes the engine's own test fixtures + demo files
        # (intentional vulns). Only ERROR-severity findings fail the build;
        # warnings (e.g. workflow tag pinning) are advisory via the SARIF upload.
        run: |
          pip install --quiet semgrep
          # --sarif --sarif-output (not the legacy --sarif-file flag, which
          # current semgrep rejects with exit 2 and produces no report).
          semgrep --config p/golang --config p/owasp-top-ten --config p/r2c-security-audit \
            --severity ERROR --sarif --sarif-output=semgrep.sarif --metrics off .

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif

      - name: Check for hardcoded secrets
        run: |
          # Scan for common secret patterns (8+ char quoted values). Report-only:
          # never fails the build on test fixtures that intentionally hold fake keys.
          if grep -rnE \
              -e "(password|passwd|secret|api[_-]?key|apikey|token)[[:space:]]*[:=][[:space:]]*[\"'][^\"']{8,}[\"']" \
              --include='*.go' --include='*.ts' --include='*.js' --include='*.yaml' \
              --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist \
              --exclude-dir=bin --exclude-dir=coverage --exclude-dir=vendor .; then
            echo "⚠️ FOUND CANDIDATE HARDCODED SECRETS — review the lines above"
          else
            echo "✅ No obvious hardcoded secrets found"
          fi

  # ── 2. CONTAINER IMAGE SCANNING ──
  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker image (prod stage only)
        # The Dockerfile's default (last) stage is 'dev' — a full Go toolchain
        # image containing all source, which trivy flags with CRITICAL/HIGH
        # CVEs. Build the slim prod stage explicitly so the scan gates the
        # actual production image.
        run: docker build --target prod -t vigilagent-scan:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'vigilagent-scan:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ── 3. DAST (DYNAMIC APPLICATION SECURITY TESTING) ──
  # Decoupled from container-scan: DAST builds its own binary, so a failed
  # image scan must not skip (and thereby mask) the dynamic scan. It runs on
  # every PR (sast.yml triggers on push + pull_request), which makes it safe
  # to require as a branch-protection status check.
  dast:
    name: Dynamic Analysis (DAST)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: vigilagent_test
          POSTGRES_USER: vigilagent
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      nats:
        image: nats:2-alpine
        ports:
          - 4222:4222

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Start server
        run: |
          go build -o bin/api ./cmd/api
          VIGILAGENT_DATABASE_HOST=localhost \
          VIGILAGENT_DATABASE_PORT=5432 \
          VIGILAGENT_DATABASE_USER=vigilagent \
          VIGILAGENT_DATABASE_PASSWORD=testpassword \
          VIGILAGENT_DATABASE_NAME=vigilagent_test \
          VIGILAGENT_DATABASE_SSLMODE=disable \
          VIGILAGENT_REDIS_HOST=localhost \
          VIGILAGENT_REDIS_PORT=6379 \
          VIGILAGENT_NATS_URL=nats://localhost:4222 \
          VIGILAGENT_AUTH_JWT_SECRET=012345678901234567890123456789012345678901 \
          VIGILAGENT_SERVER_ENV=development \
          ./bin/api &

      - name: Wait for server readiness
        # The server runs DB migrations at startup (internal/server/server.go),
        # which can take longer than a fixed sleep — poll /health instead.
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then
              echo "✅ server ready after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "❌ server did not become ready within 60s" >&2
          exit 1

      - name: Run ZAP baseline scan
        # Pinned v0.15.0 (was v0.10.0). -l WARN fails only on WARN+ alerts;
        # the -a/-j (alpha rules + Ajax spider) flags were dropped — on an
        # auth-gated JSON API they only add noise and runtime. Expected-noise
        # alerts are suppressed via .zap/rules.tsv.
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:8080'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: >-
            -l WARN

      - name: Run nuclei vulnerability scanner
        # Pinned v3.1.1 (was @main — unpinned mutable references are a supply-
        # chain risk and a semgrep advisory).
        uses: projectdiscovery/nuclei-action@v3.1.1
        with:
          target: http://localhost:8080
          severity: critical,high

  # ── 4. DEPENDENCY AUDIT ──
  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run Go module audit
        run: |
          # Check for known vulnerabilities
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck -json ./... > vuln-report.json || true

          # Check for outdated dependencies with security patches
          go list -m -u all 2>/dev/null | grep -E '\[v' || echo "All dependencies up to date"

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-report
          path: vuln-report.json
          retention-days: 30

  # ── 5. VIGILAGENT POLICY SCAN (deterministic engine + SARIF fail gate) ──
  # Runs the SAME deterministic engine the gateway uses over the workspace.
  # Fails (blocking protected branches) only on confirmed high/critical
  # findings; SARIF is uploaded to GitHub code scanning either way.
  vigilagent-scan:
    name: VigilAgent Policy Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run VigilAgent deterministic scan
        run: |
          go run ./cmd/cli scan --path . --sarif vigilagent.sarif --fail-on high,critical

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: vigilagent.sarif

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vigilagent-sarif
          path: vigilagent.sarif
          retention-days: 30
