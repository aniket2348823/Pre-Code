name: Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GOTOOLCHAIN: auto

jobs:
  # ── 0. TRIGGER GATE (always runs) ──
  # Without an always-running job, a plain branch push evaluates every job
  # away, and GitHub concludes the run "failure — No jobs were run"
  # (github/actions#2910). This gate makes branch pushes record a green run;
  # only v* tags proceed to build and release.
  gate:
    name: Release gate
    runs-on: ubuntu-latest
    steps:
      - name: Check whether this push is a release tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "RELEASE=1" >> "$GITHUB_ENV"
            echo "Release tag detected: ${{ github.ref }} — proceeding to build assets."
          else
            echo "No v* tag on this push (${{ github.ref_type }}) — nothing to release."
          fi

  # ── 1. BUILD ALL RELEASE ASSETS ──
  build:
    name: Build release assets (MCP binaries + VSIX)
    # Only v* tags actually build and release; plain pushes skip cleanly.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true

      - name: Cross-compile MCP server binaries
        run: |
          chmod +x scripts/build-mcp-binaries.sh
          ./scripts/build-mcp-binaries.sh

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Build extension VSIX
        working-directory: vscode-extension
        run: |
          npm ci
          npm pkg set version="${GITHUB_REF_NAME#v}"
          npm run typecheck
          npm run lint
          npx @vscode/vsce package

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            dist/vigilagent-mcp-*
            vscode-extension/*.vsix
          if-no-files-found: error

  # ── 2. CREATE GITHUB RELEASE + PUBLISH EVERYWHERE ──
  # (skipped automatically when `build` is skipped — GitHub propagates skips
  # through `needs:`, so branch pushes never reach this job)
  release:
    name: GitHub Release + Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: assets

      - name: Create GitHub Release with binaries + VSIX
        uses: softprops/action-gh-release@v2
        with:
          files: |
            assets/dist/vigilagent-mcp-*
            assets/vscode-extension/*.vsix
          generate_release_notes: true
          # Make re-runs of the same tag idempotent: without this, a workflow
          # re-run fails because the release already exists.
          update_release_body: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
          registry-url: 'https://registry.npmjs.org'

      - name: Install extension dependencies
        working-directory: vscode-extension
        run: npm ci

      # NOTE: the `secrets` context is NOT available in step-level `if`
      # conditions, so gating publish steps on `secrets.X != ''` made this
      # file invalid (GitHub records invalid files as failed runs with 0
      # jobs). Tokens are injected via env and gated in shell instead:
      # an absent token skips the publish step cleanly.
      - name: Publish MCP server to npm
        working-directory: mcp-server
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "No NPM_TOKEN configured — skipping npm publish."
            exit 0
          fi
          npm pkg set version="${GITHUB_REF_NAME#v}"
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish extension to Open VSX
        working-directory: vscode-extension
        run: |
          if [ -z "$OVSX_TOKEN" ]; then
            echo "No OVSX_TOKEN configured — skipping Open VSX publish."
            exit 0
          fi
          npx ovsx publish "../assets/vscode-extension/vigilagent-${GITHUB_REF_NAME#v}.vsix" -p "$OVSX_TOKEN"
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}

      - name: Publish extension to VS Code Marketplace
        working-directory: vscode-extension
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "No VSCE_PAT configured — skipping VS Code Marketplace publish."
            exit 0
          fi
          npx @vscode/vsce publish --packagePath "../assets/vscode-extension/vigilagent-${GITHUB_REF_NAME#v}.vsix" -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
